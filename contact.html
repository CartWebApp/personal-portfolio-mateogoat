<h1 id="contact-form-h1">Contact Me!</h1>
<p id="contact-form-p">Want to learn more about my work? Interested in collaborating as a team? If you have any questions or want to reach
    out about serious inquiries, contact me! </p>


<section>
    <form method="GET" id="contact-form" onsubmit="sendMessage();return false">
        <input type="text" id="name" placeholder="Name:" name="name" required>

        <input type="email" id="email" placeholder="Email:" name="email" required>

        <input type="text" placeholder="Subject" id="subject">
        
        <textarea id="message" placeholder= "Message Here.." name="message" required></textarea>

        <button type="submit">Submit!</button>
    </form>
</section>
